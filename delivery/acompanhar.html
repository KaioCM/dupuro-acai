<script src="../assets/js/supabase-config.js"></script>
<script src="delivery.js?v=5"></script>
<script>
(async function () {
  var D = DupuroDelivery, esc = D.esc, brl = D.brl, el = document.getElementById('conteudo');
  var qs = new URLSearchParams(location.search), token = qs.get('t'), novo = qs.get('novo') === '1';
  // Sem link, link quebrado ou pedido não achado: sempre com explicação e saída.
  function semPedido(titulo, txt) {
    el.innerHTML = '<div class="dl-acomp-vazio"><h1>' + titulo + '</h1><p>' + txt + '</p>' +
      '<a class="dl-btn dl-btn-gold dl-btn-block" href="https://wa.me/5565992888228" target="_blank" rel="noopener">Falar com a Dupuro no WhatsApp</a>' +
      '<a class="dl-btn dl-btn-line dl-btn-block" href="pedido.html">Fazer um pedido</a></div>';
  }
  if (!token) { semPedido('Acompanhar pedido', 'Abra o link que aparece depois do pagamento. Se perdeu o link, fale com a gente pelo WhatsApp com o código do pedido (ex.: DLV-0001).'); return; }
  if (!/^[0-9a-f-]{36}$/i.test(token)) { semPedido('Link incompleto', 'Esse link de acompanhamento veio cortado. Abra de novo pelo link completo ou fale com a gente pelo WhatsApp.'); return; }

  var ETAPAS = [
    { st: 'aguardando_pagamento', ic: '<svg class="i" aria-hidden="true"><use href="#d-cartao"/></svg>', titulo: 'Aguardando pagamento', txt: 'Assim que o Mercado Pago confirmar, seu pedido entra na rota.' },
    { st: 'pago', ic: '<svg class="i" aria-hidden="true"><use href="#d-check"/></svg>', titulo: 'Pagamento confirmado', txt: 'Seu pedido está separado e vai na rota do período escolhido.' },
    { st: 'em_rota', ic: '<svg class="i" aria-hidden="true"><use href="#d-moto"/></svg>', titulo: 'Saiu para entrega', txt: 'Estamos fazendo entregas na sua região e já chegamos aí.' },
    { st: 'entregue', ic: '<svg class="i" aria-hidden="true"><use href="#d-coracao"/></svg>', titulo: 'Entregue', txt: 'Bom apetite!' }
  ];
  var ROTULO = { aguardando_pagamento: 'Aguardando pagamento', pago: 'Pago · na fila da rota', em_rota: 'A caminho', entregue: 'Entregue' };
  function hora(t) { return t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''; }
  function dataBR(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1]; }

  async function carregar() {
    var p;
    try { p = await D.getRastreio(token); } catch (e) { semPedido('Sem conexão', 'Não conseguimos carregar seu pedido agora. Confira a internet e recarregue a página.'); return; }
    if (!p) { semPedido('Pedido não encontrado', 'Não achamos um pedido com esse link. Se você pagou agora há pouco, aguarde um minuto e recarregue.'); return; }
    if (p.status === 'cancelado' || p.status === 'expirado') {
      el.innerHTML = '<h1 class="dl-display" style="color:var(--roxo-700);font-size:26px;">Pedido ' + esc(p.codigo) + '</h1>' +
        '<p class="dl-msg erro">Este pedido foi ' + (p.status === 'expirado' ? 'expirado (pagamento não concluído)' : 'cancelado') + '. Se precisar, faça um novo pedido ou fale com a gente.</p>' +
        '<a class="dl-btn dl-btn-gold dl-btn-block" href="pedido.html">Fazer novo pedido</a>';
      return false;
    }
    if (p.status === 'pago' || p.status === 'em_rota') D.lembrarPedido(token, p.codigo); // faixa "Seu pedido"
    if (p.status === 'entregue') D.esquecerPedido(token);
    var idx = ETAPAS.findIndex(function (e) { return e.st === p.status; });
    var quando = { pago: p.pago_em, em_rota: p.saiu_em, entregue: p.entregue_em, aguardando_pagamento: p.criado_em };
    var periodoTxt = (p.periodo === 'manha' ? 'Manhã' : 'Tarde') + ' de ' + dataBR(p.data_entrega);
    var faixaHora = p.periodo === 'manha' ? 'entre 8h e 12h' : 'entre 13h e 17h';
    var link = location.origin + location.pathname + '?t=' + encodeURIComponent(token);
    var salvar = 'https://wa.me/?text=' + encodeURIComponent('Meu pedido Dupuro Açaí ' + p.codigo + ' chega ' + D.quandoEntrega(p) + ' (' + faixaHora + '). Acompanhe aqui: ' + link);
    var falar = 'https://wa.me/5565992888228?text=' + encodeURIComponent('Olá! Sobre o meu pedido de delivery ' + p.codigo + ':');
    // Acabou de pagar: tela de "deu tudo certo" no topo.
    var sucesso = novo && p.status !== 'aguardando_pagamento'
      ? '<div class="dl-sucesso" role="status"><span class="dl-sucesso-ic" aria-hidden="true"><svg class="i"><use href="#d-check"/></svg></span>' +
          '<h1>Pedido confirmado!</h1>' +
          '<p>Recebemos seu pagamento. Seu açaí chega <strong>' + esc(D.quandoEntrega(p)) + ', ' + faixaHora + '</strong>.</p></div>'
      : '';
    var acoes = '<div class="dl-acomp-acoes">' +
      '<a class="dl-btn dl-btn-gold dl-btn-block" href="' + esc(salvar) + '" target="_blank" rel="noopener">Salvar este link no meu WhatsApp</a>' +
      '<a class="dl-btn dl-btn-line dl-btn-block" href="' + esc(falar) + '" target="_blank" rel="noopener">Falar com a Dupuro</a></div>';
    el.innerHTML = sucesso +
      (sucesso ? '' : '<div class="dl-acomp-hero"><h1>Olá, ' + esc(p.cliente) + '!</h1>' +
        '<p>Pedido <strong>' + esc(p.codigo) + '</strong> · entrega na <strong>' + esc(periodoTxt) + '</strong></p>' +
        '<span class="st">' + esc(ROTULO[p.status] || p.status) + '</span></div>') +
      '<div class="dl-bloco"><div class="dl-card"><ul class="dl-timeline">' + ETAPAS.map(function (e, i) {
        var cls = i < idx ? 'feito' : (i === idx ? (p.status === 'entregue' ? 'feito' : 'atual') : '');
        return '<li class="' + cls + '"><span class="dot">' + e.ic + '</span><strong>' + e.titulo + '</strong><span>' +
          (i <= idx ? (hora(quando[e.st]) + (i === idx ? ' — ' + e.txt : '')) : '') + '</span></li>';
      }).join('') + '</ul></div></div>' +
      '<div class="dl-bloco"><h2 style="font:800 17px Inter,sans-serif;color:var(--roxo-900);margin:0 0 10px;"><svg class="i" aria-hidden="true"><use href="#d-sacola"/></svg> Seu pedido</h2><div class="dl-card dl-itens">' +
        (p.itens || []).map(function (it) {
          return '<div class="ln"><span>' + it.quantidade + '× ' + esc(it.nome) + (it.sabor ? ' — ' + esc(it.sabor) : '') + '</span><span>' + brl(it.preco * it.quantidade) + '</span></div>';
        }).join('') +
        '<div class="ln"><span>Entrega</span><span>' + brl(p.taxa) + '</span></div>' +
        '<div class="ln tot"><span>Total</span><span>' + brl(p.total) + '</span></div></div></div>' +
      acoes;
    return p.status !== 'entregue';
  }
  // Atualiza sozinho enquanto o pedido não foi entregue (pagamento cai via webhook).
  var continuar = await carregar();
  var t = setInterval(async function () { if (!(await carregar())) clearInterval(t); }, 20000);
  if (!continuar) clearInterval(t);
})();
</script>
