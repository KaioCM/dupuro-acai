<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acompanhar pedido — Dupuro Delivery</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#601050">
<link rel="icon" href="../assets/img/brand/favicon-32.png" sizes="32x32" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/style.css?v=11">
<link rel="stylesheet" href="delivery.css?v=3">
</head>
<body class="dl-body">

<header class="dl-app-top">
  <div class="dl-wrap">
    <a class="vol" href="index.html">← Início</a>
    <img src="../assets/img/brand/logo-branco.png" alt="Dupuro Açaí">
    <a class="vol" href="https://wa.me/5565992888228" target="_blank" rel="noopener">Ajuda</a>
  </div>
</header>

<main class="dl-app" style="padding-bottom:40px;">
  <div id="conteudo"><p class="dl-vazio">Carregando seu pedido…</p></div>
</main>

<script src="../assets/js/supabase-config.js"></script>
<script src="delivery.js?v=2"></script>
<script>
(async function () {
  var D = DupuroDelivery, esc = D.esc, brl = D.brl, el = document.getElementById('conteudo');
  var token = new URLSearchParams(location.search).get('t');
  if (!token) { el.innerHTML = '<p class="dl-msg erro">Link de acompanhamento inválido.</p>'; return; }

  var ETAPAS = [
    { st: 'aguardando_pagamento', ic: '💳', titulo: 'Aguardando pagamento', txt: 'Assim que o Mercado Pago confirmar, seu pedido entra na rota.' },
    { st: 'pago', ic: '✅', titulo: 'Pagamento confirmado', txt: 'Seu pedido está separado e vai na rota do período escolhido.' },
    { st: 'em_rota', ic: '🛵', titulo: 'Saiu para entrega', txt: 'Estamos fazendo entregas na sua região e já chegamos aí.' },
    { st: 'entregue', ic: '💜', titulo: 'Entregue', txt: 'Bom apetite!' }
  ];
  var ROTULO = { aguardando_pagamento: 'Aguardando pagamento', pago: 'Pago · na fila da rota', em_rota: 'A caminho', entregue: 'Entregue' };
  function hora(t) { return t ? new Date(t).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : ''; }
  function dataBR(iso) { var p = String(iso).split('-'); return p[2] + '/' + p[1]; }

  async function carregar() {
    var p;
    try { p = await D.getRastreio(token); } catch (e) { el.innerHTML = '<p class="dl-msg erro">Não conseguimos carregar agora. Tente de novo em instantes.</p>'; return; }
    if (!p) { el.innerHTML = '<p class="dl-msg erro">Pedido não encontrado.</p>'; return; }
    if (p.status === 'cancelado' || p.status === 'expirado') {
      el.innerHTML = '<h1 class="dl-display" style="color:var(--roxo-700);font-size:26px;">Pedido ' + esc(p.codigo) + '</h1>' +
        '<p class="dl-msg erro">Este pedido foi ' + (p.status === 'expirado' ? 'expirado (pagamento não concluído)' : 'cancelado') + '. Se precisar, faça um novo pedido ou fale com a gente.</p>' +
        '<a class="dl-btn dl-btn-gold dl-btn-block" href="pedido.html">Fazer novo pedido</a>';
      return false;
    }
    var idx = ETAPAS.findIndex(function (e) { return e.st === p.status; });
    var quando = { pago: p.pago_em, em_rota: p.saiu_em, entregue: p.entregue_em, aguardando_pagamento: p.criado_em };
    var periodoTxt = (p.periodo === 'manha' ? 'Manhã' : 'Tarde') + ' de ' + dataBR(p.data_entrega);
    el.innerHTML =
      '<div class="dl-acomp-hero"><h1>Olá, ' + esc(p.cliente) + '!</h1>' +
        '<p>Pedido <strong>' + esc(p.codigo) + '</strong> · entrega na <strong>' + esc(periodoTxt) + '</strong></p>' +
        '<span class="st">' + esc(ROTULO[p.status] || p.status) + '</span></div>' +
      '<div class="dl-bloco"><div class="dl-card"><ul class="dl-timeline">' + ETAPAS.map(function (e, i) {
        var cls = i < idx ? 'feito' : (i === idx ? (p.status === 'entregue' ? 'feito' : 'atual') : '');
        return '<li class="' + cls + '"><span class="dot">' + e.ic + '</span><strong>' + e.titulo + '</strong><span>' +
          (i <= idx ? (hora(quando[e.st]) + (i === idx ? ' — ' + e.txt : '')) : '') + '</span></li>';
      }).join('') + '</ul></div></div>' +
      '<div class="dl-bloco"><h2 style="font:800 17px Inter,sans-serif;color:var(--roxo-900);margin:0 0 10px;">🛍️ Seu pedido</h2><div class="dl-card dl-itens">' +
        (p.itens || []).map(function (it) {
          return '<div class="ln"><span>' + it.quantidade + '× ' + esc(it.nome) + (it.sabor ? ' — ' + esc(it.sabor) : '') + '</span><span>' + brl(it.preco * it.quantidade) + '</span></div>';
        }).join('') +
        '<div class="ln"><span>Entrega</span><span>' + brl(p.taxa) + '</span></div>' +
        '<div class="ln tot"><span>Total</span><span>' + brl(p.total) + '</span></div></div></div>';
    return p.status !== 'entregue';
  }
  // Atualiza sozinho enquanto o pedido não foi entregue (pagamento cai via webhook).
  var continuar = await carregar();
  var t = setInterval(async function () { if (!(await carregar())) clearInterval(t); }, 20000);
  if (!continuar) clearInterval(t);
})();
</script>
</body>
</html>
